<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141211">
  <title>Aftertone</title>
  <link rel="icon" href="/icon.png">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Instrument+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" type="module"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="#home"><img src="/icon.png" alt="" width="32" height="32">Aftertone</a>
    <form id="search" hidden role="search"><label class="sr" for="query">Search music</label><input id="query" type="search" placeholder="Search songs, artists, albums" maxlength="160" required><button type="submit" aria-label="Search">⌕</button></form>
    <button id="signout" hidden type="button" class="quiet">Sign out</button>
  </header>
  <div id="shell" class="shell" hidden>
    <nav id="nav" aria-label="Library">
      <a href="#home">Home</a><a href="#explore">Explore</a><a href="#likes">Liked songs</a><a href="#playlists">Playlists</a><a href="#history">History</a><a id="admin-link" href="#admin" hidden>Accounts</a>
    </nav>
    <main id="main" tabindex="-1"></main>
  </div>
  <main id="login" class="login" hidden>
    <form id="credentials" class="auth">
      <img src="/icon.png" alt="" width="56" height="56">
      <h1 id="auth-title">Sign in to Aftertone</h1>
      <p>Your music, playlists, and recommendations follow you between Android and the web.</p>
      <label for="username">Email, phone number, or username</label>
      <input id="username" name="username" autocomplete="username" required maxlength="200">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128">
      <button id="submit" class="accent" type="submit">Sign in</button>
      <button id="change-mode" class="quiet" type="button">Create an account</button>
      <p id="auth-error" role="status"></p>
    </form>
  </main>
  <footer id="player" class="player" hidden>
    <div class="now"><img id="art" alt="" width="44" height="44"><div><strong id="song"></strong><span id="artist"></span></div></div>
    <div class="playback"><button id="previous" type="button" aria-label="Previous">⏮</button><audio id="audio" controls preload="none"></audio><button id="next" type="button" aria-label="Next">⏭</button></div>
    <div><button id="like-now" type="button" aria-label="Like song" aria-pressed="false">♡</button><button id="add-now" type="button" aria-label="Add to playlist">＋</button></div>
  </footer>
  <div id="toast" role="status" hidden></div>
  <dialog id="dialog"><form id="playlist-form"><h2 id="dialog-title">Playlist</h2><div id="playlist-fields"></div><div class="dialog-actions"><button id="cancel" type="button" class="quiet">Cancel</button><button class="accent" type="submit">Save</button></div></form></dialog>
</body>
</html>
