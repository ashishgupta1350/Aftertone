services:
  - type: web
    name: aftertone
    plan: free
    runtime: docker
    rootDir: web
    healthCheckPath: /healthz
    envVars:
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_DATABASE_URL
        sync: false
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: AFTERTONE_ADMIN_UID
        sync: false
